name: Build OrangeFox Recovery for DEXP Ursus B38

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Setup build environment
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          git-core gnupg flex bison gperf build-essential \
          zip curl zlib1g-dev gcc-multilib g++-multilib \
          libc6-dev-i386 lib32ncurses-dev x11proto-core-dev \
          libx11-dev lib32z1-dev libgl1-mesa-dev \
          libxml2-utils xsltproc unzip fontconfig \
          python3 python3-pip python3-venv

    - name: Force create device tree
      run: |
        # Создаём папку, если её нет
        mkdir -p device/dexp/ursus_b38
        
        # Копируем все файлы из корня репозитория в папку устройства
        # Если файлы уже лежат в device/dexp/ursus_b38/, эта команда просто обновит их
        cp -r ./* device/dexp/ursus_b38/ 2>/dev/null || true
        
        # Удаляем лишнее (чтобы не мешало)
        rm -rf device/dexp/ursus_b38/.github
        rm -rf device/dexp/ursus_b38/.git
        rm -f device/dexp/ursus_b38/README.md
        rm -f device/dexp/ursus_b38/.gitkeep
        rm -f device/dexp/ursus_b38/.gitignore
        
        # Проверяем, что файлы на месте
        ls -la device/dexp/ursus_b38/
        
        # Проверяем содержимое ключевых файлов (для отладки)
        echo "=== AndroidProducts.mk ==="
        cat device/dexp/ursus_b38/AndroidProducts.mk || echo "Файл отсутствует!"
        echo "=== twrp_ursus_b38.mk ==="
        cat device/dexp/ursus_b38/twrp_ursus_b38.mk || echo "Файл отсутствует!"

    - name: Build OrangeFox Recovery
      uses: UWU-TEAM/UWU-OrangeFox-Builder@v1.0.0
      with:
        USER_NAME: 'Egor'
        USER_EMAIL: 'egor@gmail.com'
        DEVICE_PATH: 'device/dexp/ursus_b38'
        DEVICE_NAME: 'ursus_b38'
        BUILD_TARGET: 'recovery'
        GH_RELEASE: 'true'
        SKIP_DEVICE_TREE_CLONE: 'true'
