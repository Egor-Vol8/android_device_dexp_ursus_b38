name: Build OrangeFox Recovery Final

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
    - name: Проверка репозитория
      uses: actions/checkout@v4

    - name: Сборка OrangeFox
      uses: UWU-TEAM/UWU-OrangeFox-Builder@v1.0.0
      with:
        USER_NAME: 'Egor-Vol8'
        USER_EMAIL: 'akkauntzcvi@gmail.com'
        # Чистая ссылка без кавычек, плагин проглотит её идеально
        DEVICE_TREE: 'https://github.com/Egor-Vol8/android_device_dexp_ursus_b38'
        DEVICE_TREE_BRANCH: 'main'
        DEVICE_PATH: 'device/dexp/ursus_b38'
        DEVICE_NAME: 'ursus_b38'
        BUILD_TARGET: 'recovery'
        GH_RELEASE: 'true'
